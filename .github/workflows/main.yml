name: Deploy LaTeX PDF to GitHub Pages
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Compile English CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: CV_CHARF_ENG
          latexmk_use_xelatex: true

      - name: Compile French CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: CV_CHARF_FR
          latexmk_use_xelatex: true

      - name: Move PDFs to output folder
        run: |
          mkdir -p out/eng out/fr
          mv CV_CHARF_ENG/cv.pdf out/eng/cv.pdf
          mv CV_CHARF_FR/cv.pdf out/fr/cv.pdf

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
